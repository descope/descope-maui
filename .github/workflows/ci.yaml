name: dotnet package

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    permissions:
      contents: read
      actions: read
      checks: write
    # macOS so the iOS target builds; the runner image also has the Android SDK and JDK
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x.x
      - name: Install workloads
        run: dotnet workload install ios android
      - name: Install dependencies
        run: dotnet restore
      - name: Build with dotnet
        run: dotnet build --no-restore --configuration Release
      - name: Test with dotnet
        run: dotnet test --no-build --configuration Release --logger trx --results-directory "TestResults"
      - name: Pack
        run: dotnet pack --no-build --configuration Release Descope.Maui

      - name: Post test results to GitHub
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: .NET Tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx

  gitleaks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history, a secret that was committed and then removed is still leaked
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan history
        run: /tmp/gitleaks git --redact --verbose --exit-code 1
